<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCF9F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="慢慢瘦">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>慢慢瘦 · 日常减肥打卡</title>
<style>
:root{
  --bg:#FCF9F4;
  --card:#FFFFFF;
  --ink:#2C3A33;
  --ink-2:#4A5B52;
  --sub:#8A968E;
  --line:#EDE8DE;
  --green:#3F8F6B;
  --green-deep:#2E7154;
  --green-soft:#E9F4ED;
  --green-mid:#BFE0CC;
  --amber:#D99552;
  --amber-soft:#FBF0E2;
  --up:#D25B4B;
  --down:#2E8B57;
  --shadow:0 2px 14px rgba(60,72,60,.055);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#F3EFE7;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.shell{
  max-width:480px;margin:0 auto;min-height:100vh;
  background:var(--bg);position:relative;
  box-shadow:0 0 40px rgba(60,60,50,.08);
  display:flex;flex-direction:column;
}
.topbar{
  position:sticky;top:0;z-index:20;
  height:52px;flex:0 0 52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:rgba(252,249,244,.94);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;letter-spacing:.5px}
.brand-dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.topbar-right{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}
.link-btn{color:var(--green-deep);font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px;background:var(--green-soft)}
.main{flex:1;padding:16px 16px calc(90px + env(safe-area-inset-bottom));}
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:30;
  display:flex;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--sub)}
.tab.active{color:var(--green-deep);font-weight:700}
.tab-ic{display:block;height:22px}
.tab-ic svg{width:22px;height:22px;display:block}
.ic{width:20px;height:20px;display:block}

h1,h2,h3,p{margin:0}
.h1{font-size:23px;line-height:1.35;font-weight:750;letter-spacing:.2px}
.h2{font-size:16px;font-weight:700}
.muted{color:var(--sub);font-size:12.5px;line-height:1.65}
.small{font-size:12px;color:var(--sub)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.section-title .h2{font-size:15.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.gap{height:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- 今天 ---------- */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar .d-main{font-size:14px;font-weight:700}
.datebar .d-sub{font-size:11.5px;color:var(--sub);font-weight:400;margin-left:6px}
.nav-arrows{display:flex;align-items:center;gap:2px}
.arrow{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);background:#fff;border:1px solid var(--line)}
.arrow[disabled]{opacity:.32;cursor:default}
.arrow svg{width:16px;height:16px}
.hero{padding:18px 16px;display:flex;align-items:center;gap:16px}
.ring-wrap{position:relative;width:96px;height:96px;flex:0 0 96px}
.ring-wrap svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring-bg{stroke:#EFECE4}
.ring-fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .45s ease}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-num{font-size:25px;font-weight:750;color:var(--green-deep)}
.ring-unit{font-size:11px;color:var(--sub);margin-top:2px}
.hero-txt{flex:1;min-width:0}
.streak-chip{display:inline-flex;align-items:center;gap:5px;background:var(--amber-soft);color:#A9682C;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;margin-bottom:8px}
.hero-line{font-size:14px;color:var(--ink-2);line-height:1.55;font-weight:600}
.hero-sub{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}

.onething{background:linear-gradient(135deg,#EAF5EE,#F6FAF3);border:1px solid #D8EBDE;border-radius:var(--radius);padding:16px;margin-top:12px}
.onething .ot-label{font-size:11.5px;color:var(--green-deep);font-weight:700;letter-spacing:.5px}
.onething .ot-title{font-size:17px;font-weight:750;margin:6px 0 4px}
.onething .ot-desc{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.ot-btn{margin-top:12px;width:100%;height:42px;border-radius:12px;background:var(--green);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.ot-btn svg{width:17px;height:17px}
.ot-done{display:flex;align-items:center;gap:9px;margin-top:12px;background:var(--green-soft);border-radius:12px;padding:11px 13px;color:var(--green-deep);font-size:13px;font-weight:600}
.ot-done svg{width:17px;height:17px;flex:0 0 17px}

.checklist{overflow:hidden}
.ci{display:flex;align-items:flex-start;gap:12px;padding:14px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#fff;transition:background .18s}
.ci:last-child{border-bottom:0}
.ci:active{background:#FAF8F3}
.ci.on{background:#F7FCF9}
.ci-ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--green-soft);color:var(--green-deep);display:flex;align-items:center;justify-content:center}
.ci-ic svg{width:20px;height:20px}
.ci.on .ci-ic{background:var(--green);color:#fff}
.ci-body{flex:1;min-width:0}
.ci-title{font-size:14.5px;font-weight:650;line-height:1.4;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ci.on .ci-title{color:var(--green-deep)}
.ci-desc{font-size:12px;color:var(--sub);line-height:1.5;margin-top:3px}
.star{font-size:10px;font-weight:700;color:#A9682C;background:var(--amber-soft);padding:2px 6px;border-radius:5px;letter-spacing:.3px}
.ci-box{width:23px;height:23px;flex:0 0 23px;border-radius:8px;border:1.8px solid #D9DED8;margin-top:6px;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .18s}
.ci-box svg{width:14px;height:14px}
.ci.on .ci-box{background:var(--green);border-color:var(--green);color:#fff}

.bonus-grid{display:grid;grid-template-columns:1fr;gap:8px}
.bonus{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:left;width:100%;font-size:13px;color:var(--ink-2)}
.bonus.on{background:var(--green-soft);border-color:var(--green-mid);color:var(--green-deep)}
.b-box{width:18px;height:18px;flex:0 0 18px;border-radius:6px;border:1.6px solid #D3DAD3;display:flex;align-items:center;justify-content:center;color:transparent}
.b-box svg{width:12px;height:12px}
.bonus.on .b-box{background:var(--green);border-color:var(--green);color:#fff}
.b-star{margin-left:auto;color:var(--amber);font-size:11px;flex:0 0 auto}

.weight-row{display:flex;gap:8px;align-items:center}
.weight-input{flex:1;min-width:0;height:42px;border:1.5px solid var(--line);border-radius:11px;padding:0 12px;background:#FCFBF8;font-size:15px;font-variant-numeric:tabular-nums;outline:none}
.weight-input:focus{border-color:var(--green-mid);background:#fff}
.btn-primary{height:42px;padding:0 18px;border-radius:11px;background:var(--green);color:#fff;font-size:14px;font-weight:700;flex:0 0 auto}
.btn-ghost{height:40px;padding:0 15px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.w-latest{font-size:12.5px;color:var(--sub);margin-top:10px}
.w-delta-up{color:var(--up);font-weight:700}
.w-delta-down{color:var(--down);font-weight:700}

.tip-strip{margin-top:16px;padding:13px 14px;background:#F6F2E9;border-radius:12px;font-size:12.5px;color:#7A7364;line-height:1.6;display:flex;gap:9px;align-items:flex-start}
.tip-strip svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px;color:var(--amber)}

/* ---------- 方案 ---------- */
.lead{background:linear-gradient(140deg,#3F8F6B,#2E7154);color:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 6px 20px rgba(46,113,84,.18)}
.lead .l-kicker{font-size:11.5px;opacity:.82;letter-spacing:1px;font-weight:600}
.lead .l-title{font-size:20px;font-weight:750;line-height:1.45;margin:8px 0 8px}
.lead .l-desc{font-size:13px;line-height:1.7;opacity:.92}
.principles{display:grid;gap:9px;margin-top:12px}
.pr{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.pr-num{width:27px;height:27px;flex:0 0 27px;border-radius:9px;background:var(--green-soft);color:var(--green-deep);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pr-t{font-size:14px;font-weight:700}
.pr-d{font-size:12.5px;color:var(--sub);line-height:1.55;margin-top:2px}

.plain{font-size:13.5px;color:var(--ink-2);line-height:1.8;padding:15px 16px}
.plain strong{color:var(--ink);font-weight:700}
.plain + .plain{border-top:1px dashed var(--line)}
.quote{border-left:3px solid var(--green-mid);padding-left:11px;margin:10px 0 0;font-size:13px;color:var(--ink-2);line-height:1.7}

.step{display:flex;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step-n{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-t{font-size:14px;font-weight:700}
.step-d{font-size:12.8px;color:var(--ink-2);line-height:1.65;margin-top:3px}
.step-tip{font-size:12px;color:var(--green-deep);background:var(--green-soft);border-radius:8px;padding:7px 10px;margin-top:8px;line-height:1.55}

.move{padding:15px;border-bottom:1px solid var(--line)}
.move:last-child{border-bottom:0}
.move-head{display:flex;align-items:center;gap:10px}
.move-ic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:var(--amber-soft);color:#B67836;display:flex;align-items:center;justify-content:center}
.move-ic svg{width:19px;height:19px}
.move-t{font-size:14.5px;font-weight:700}
.move-when{font-size:11.5px;color:var(--sub);margin-top:1px}
.move-body{font-size:12.8px;color:var(--ink-2);line-height:1.7;margin-top:10px}
.move-note{font-size:12px;color:#9A8268;background:#FBF5EC;border-radius:8px;padding:7px 10px;margin-top:8px;line-height:1.55}

details.faq{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
details.faq summary{list-style:none;padding:13px 14px;font-size:13.5px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:after{content:"+";font-size:18px;color:var(--green);font-weight:400;line-height:1;flex:0 0 auto}
details.faq[open] summary:after{content:"−"}
details.faq .faq-body{padding:0 14px 14px;font-size:12.8px;color:var(--ink-2);line-height:1.75}
.notice{background:#FBF4EF;border:1px solid #F0DFD2;border-radius:13px;padding:14px 15px;font-size:12.5px;color:#8A6A55;line-height:1.75}
.notice b{color:#7A563F}
.notice ul{margin:7px 0 0;padding-left:18px}
.notice li{margin-bottom:4px}

/* ---------- 记录 ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center}
.stat-v{font-size:21px;font-weight:750;color:var(--green-deep);line-height:1.2;font-variant-numeric:tabular-nums}
.stat-l{font-size:11px;color:var(--sub);margin-top:4px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:4px}
.heat-cell{aspect-ratio:1;border-radius:8px;background:#F0EDE5;display:flex;align-items:center;justify-content:center;font-size:10px;color:#B3B8B0;position:relative}
.heat-cell.l1{background:#DCEDDF;color:#6E8A76}
.heat-cell.l2{background:#B5DCC2;color:#376249}
.heat-cell.l3{background:#7BC49C;color:#fff}
.heat-cell.l4{background:var(--green);color:#fff}
.heat-cell.is-today{outline:2px solid var(--amber);outline-offset:1px}
.heat-cell.future{background:transparent;border:1px dashed #E7E3D9}
.heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--sub)}
.heat-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.chart-box{padding:14px 15px}
.chart-empty{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--sub);font-size:12.5px}
.chart-empty svg{width:26px;height:26px;color:#CBD6CC}
.chart-svg{width:100%;height:130px;display:block;overflow:visible}
.chart-meta{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.chart-now{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.chart-lab{font-size:11.5px;color:var(--sub)}
.review{font-size:13px;color:var(--ink-2);line-height:1.75}
.review b{color:var(--green-deep)}
.review .rv-line{display:flex;gap:9px;padding:7px 0;align-items:flex-start}
.review .rv-line + .rv-line{border-top:1px dashed var(--line)}
.rv-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 6px;margin-top:8px}
.data-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.data-btn{height:42px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.data-btn svg{width:15px;height:15px}
.data-btn.danger{color:#B5645A;border-color:#EEDBD6;grid-column:span 2}
.empty-mini{font-size:12.5px;color:var(--sub);padding:10px 0}

/* ---------- 通用 ---------- */
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);background:rgba(44,58,51,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade-in{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:360px){
  .hero{padding:15px 12px;gap:12px}
  .ring-wrap,.ring-wrap svg{width:84px;height:84px}
  .ring-wrap{flex-basis:84px}
  .h1{font-size:21px}
}

/* ---------- 分享图弹层 ---------- */
.share-entry{width:100%;height:46px;border-radius:13px;background:var(--green-soft);border:1px solid #D8EBDE;color:var(--green-deep);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px}
.share-entry svg{width:17px;height:17px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,40,34,.46)}
.modal-inner{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.14)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{font-size:13px;color:var(--sub);padding:6px 4px}
.seg{display:flex;background:#F0EDE5;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--green-deep);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.share-label{font-size:12px;color:var(--sub);margin:15px 2px 7px}
.share-input{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;font-size:13.5px;outline:none}
.share-input:focus{border-color:var(--green-mid)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 4px;font-size:13px;color:var(--ink-2);cursor:pointer}
.switch{width:42px;height:24px;border-radius:99px;background:#DCDDD7;position:relative;transition:background .2s;flex:0 0 42px}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on:after{transform:translateX(18px)}
.share-preview{margin-top:10px;background:#EFEBE2;border-radius:14px;padding:10px;display:flex;justify-content:center}
.share-preview img{width:auto;max-width:100%;max-height:300px;height:auto;display:block;border-radius:8px;box-shadow:0 3px 14px rgba(0,0,0,.10)}
.share-hint{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:11px;text-align:center}
.share-actions{display:flex;gap:9px;margin-top:13px}
.share-actions button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:700}
.btn-save{background:var(--green);color:#fff}
.btn-sec{background:#fff;border:1px solid var(--line);color:var(--ink-2)}

</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span>慢慢瘦</span></div>
    <div class="topbar-right" id="topbarRight"></div>
  </header>
  <main id="main" class="main"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="today" type="button"><span class="tab-ic" id="tabIcToday"></span><span>今天</span></button>
    <button class="tab" data-tab="plan" type="button"><span class="tab-ic" id="tabIcPlan"></span><span>方案</span></button>
    <button class="tab" data-tab="log" type="button"><span class="tab-ic" id="tabIcLog"></span><span>记录</span></button>
  </nav>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<script>
/* 慢慢瘦 · 全部文案与图标数据（改内容只改这个文件） */
var ICONS = {
  today: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M9 15l2 2 4-4"/>',
  plan: '<path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4z"/><path d="M8 9h7M8 13h7M8 17h4"/>',
  log: '<path d="M4 20h16"/><rect x="5" y="12" width="3" height="6" rx="1"/><rect x="10.5" y="8" width="3" height="10" rx="1"/><rect x="16" y="4" width="3" height="14" rx="1"/>',

<script>
/* 慢慢瘦 · 逻辑层（数据只存在本机 localStorage） */
(function () {
  'use strict';

  var KEY = 'daily-slim-v1';
  var TABS = ['today', 'plan', 'log'];
  var CORE_IDS = CORE.map(function (x) { return x.id; });
  var BONUS_IDS = BONUS.map(function (x) { return x.id; });
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateObj(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = dateObj(s); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function diffDays(a, b) {
    var x = dateObj(a), y = dateObj(b);
    return Math.round((Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()) - Date.UTC(y.getFullYear(), y.getMonth(), y.getDate())) / 86400000);
  }
  function mondayOf(s) { return addDays(s, -((dateObj(s).getDay() + 6) % 7)); }
  function md(s) { var p = s.split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; }
  function wd(s) { return WD[dateObj(s).getDay()]; }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function el(id) { return document.getElementById(id); }

  function blank() { return { v: 1, created: todayStr(), days: {} }; }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object' || typeof o.days !== 'object' || !o.days) return blank();
      if (!o.created) o.created = todayStr();
      return o;
    } catch (e) { return blank(); }
  }
  var state = load();
  var curTab = (function () { var h = location.hash.replace('#', ''); return TABS.indexOf(h) >= 0 ? h : 'today'; })();
  var viewDate = todayStr();
  var toastTimer = null;

  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { toast('记录没能保存，请检查浏览器存储设置'); return false; }
  }
  function getDay(s) { return state.days[s] || null; }
  function ensureDay(s) {
    if (!state.days[s]) state.days[s] = { c: [], b: [], w: null };
    var d = state.days[s];
    if (!Array.isArray(d.c)) d.c = [];
    if (!Array.isArray(d.b)) d.b = [];
    if (d.w == null) d.w = null;
    return d;
  }
  function touched(d) { return !!d && ((d.c && d.c.length) || (d.b && d.b.length) || d.w != null); }
  function cCount(d) { return d && Array.isArray(d.c) ? d.c.length : 0; }

  function streak() {
    var t = todayStr();
    var cur = touched(getDay(t)) ? t : addDays(t, -1);
    var n = 0;
    for (var i = 0; i < 400; i++) {
      if (!touched(getDay(cur))) break;
      n++; cur = addDays(cur, -1);
    }
    return n;
  }
  function rate7() {
    var t = todayStr();
    var span = Math.max(1, Math.min(7, diffDays(t, state.created) + 1));
    var total = 0;
    for (var i = 0; i < span; i++) total += cCount(getDay(addDays(t, -i)));
    return Math.round(total / (span * CORE.length) * 100);
  }
  function recordedDays() {
    return Object.keys(state.days).filter(function (k) { return touched(state.days[k]); }).length;
  }
  function weightList() {
    return Object.keys(state.days)
      .filter(function (k) { return typeof state.days[k].w === 'number' && state.days[k].w > 0; })
      .sort()
      .map(function (k) { return { d: k, w: state.days[k].w }; });
  }
  function latestWeight() { var a = weightList(); return a.length ? a[a.length - 1] : null; }

  /* ---------------- 今天 ---------------- */
  function renderToday() {
    var t = todayStr();
    var isToday = viewDate === t;
    var d = getDay(viewDate) || { c: [], b: [], w: null };
    var c = d.c || [], b = d.b || [];
    var done = c.length;
    var circumference = 2 * Math.PI * 40;
    var offset = circumference * (1 - done / CORE.length);
    var st = streak();
    var tip = TIPS[(diffDays(viewDate, '2026-01-01') % TIPS.length + TIPS.length) % TIPS.length];

    var h = [];
    h.push('<div class="datebar">');

  function heatClass(n) {

  function renderChart() {
    var a = weightList().slice(-12);
    if (!a.length) {
      return '<div class="chart-empty">' + svg('chart') + '<span>还没有体重记录</span><span style="font-size:11.5px">在「今天」页随手记一次就行</span></div>';
    }
    var last = a[a.length - 1], prev = a.length > 1 ? a[a.length - 2] : null;
    var delta = prev ? Math.round((last.w - prev.w) * 10) / 10 : null;
    var dh = '';
    if (delta === null) dh = '<span class="chart-lab">第一次记录，之后就能看趋势</span>';
    else if (delta > 0) dh = '<span class="w-delta-up">↑ ' + delta.toFixed(1) + ' kg</span> <span class="chart-lab">比上次</span>';
    else if (delta < 0) dh = '<span class="w-delta-down">↓ ' + Math.abs(delta).toFixed(1) + ' kg</span> <span class="chart-lab">比上次</span>';
    else dh = '<span class="chart-lab">和上次持平</span>';

    var vals = a.map(function (x) { return x.w; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = max - min; if (span < 0.8) span = 0.8;
    var mid = (max + min) / 2;
    var lo = mid - span / 2 - 0.12, hi = mid + span / 2 + 0.12;
    var W = 320, H = 120, L = 14, R = 14, T = 14, B = 24;
    var pts = a.map(function (x, i) {
      var px = a.length === 1 ? W / 2 : L + i * (W - L - R) / (a.length - 1);
      var py = T + (hi - x.w) / (hi - lo) * (H - T - B);
      return { x: px, y: py };
    });
    var line = pts.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var s = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
    s += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="#EDE8DE" stroke-width="1"/>';
    if (pts.length > 1) s += '<polyline points="' + line + '" fill="none" stroke="#3F8F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
    pts.forEach(function (p, i) {
      s += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (i === pts.length - 1 ? 4.2 : 2.8) + '" fill="' + (i === pts.length - 1 ? '#2E7154' : '#3F8F6B') + '"/>';
    });
    s += '<text x="' + L + '" y="' + (H - 6) + '" fill="#8A968E" font-size="10">' + md(a[0].d) + '</text>';
    s += '<text x="' + (W - R) + '" y="' + (H - 6) + '" fill="#8A968E" font-size="10" text-anchor="end">' + md(last.d) + '</text>';
    s += '</svg>';
    return '<div class="chart-meta"><span class="chart-now">' + last.w.toFixed(1) + ' <span style="font-size:12px;color:var(--sub);font-weight:400">kg</span></span>' + dh + '</div>' + s;
  }

  /* ---------------- 分享图（原生 Canvas，无依赖） ---------------- */
  var SH = {
    bg: '#FCF9F4', card: '#FFFFFF', ink: '#2C3A33', sub: '#8A968E',
    green: '#3F8F6B', deep: '#2E7154', soft: '#E9F4ED', line: '#EDE8DE', amber: '#D99552'
  };
  var HEAT = ['#F0EDE5', '#DCEDDF', '#B5DCC2', '#7BC49C', '#3F8F6B'];
  var FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  var shareState = { layout: 'xhs', text: '', showWeight: false };
  var shareCanvas = null, shareTimer = null;

  function heatIdx(n) { return n <= 0 ? 0 : n <= 2 ? 1 : n <= 4 ? 2 : n === 5 ? 3 : 4; }
  function cText(ctx, s, x, y, size, color, bold, align) {
    ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT;
    ctx.fillStyle = color || SH.ink;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(s, x, y);
  }
  function rRect(ctx, x, y, w, h, r, fill, stroke, lw) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  function wrapLines(ctx, s, maxW, maxLines, size, bold) {
    ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT;
    var lines = [], cur = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (cur && ctx.measureText(cur + ch).width > maxW) {
        lines.push(cur); cur = ch;
        if (lines.length >= maxLines) break;
      } else cur += ch;
    }
    if (lines.length < maxLines && cur) lines.push(cur);
    if (lines.length === maxLines && lines.join('').length < s.length) {
      var last = lines[maxLines - 1];
      while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      lines[maxLines - 1] = last + '…';
    }
    return lines;
  }
  function drawHeat(ctx, x, y, cell, gap, cells, showDate) {
    cells.forEach(function (c, i) {
      var cx = x + (i % 7) * (cell + gap);
      var cy = y + Math.floor(i / 7) * (cell + gap);
      var r = Math.max(4, cell * 0.22);
      if (c.future) {
        rRect(ctx, cx, cy, cell, cell, r, '#F7F4ED');
        ctx.save(); ctx.setLineDash([6, 6]);
        rRect(ctx, cx, cy, cell, cell, r, null, '#E2DDD1', 2);
        ctx.restore();
      } else {
        rRect(ctx, cx, cy, cell, cell, r, HEAT[heatIdx(c.n)]);
        if (showDate) {
          var col = c.n >= 5 ? '#FFFFFF' : (c.n >= 3 ? '#204A34' : '#8A968E');
          cText(ctx, String(+c.d.split('-')[2]), cx + cell / 2, cy + cell / 2 + cell * 0.17,
            Math.round(cell * 0.30), col, false, 'center');
        }
      }
      if (c.today) rRect(ctx, cx - 3, cy - 3, cell + 6, cell + 6, r + 3, null, SH.amber, 4);
    });
  }
  function shareStats() {
    var t = todayStr(), start = addDays(mondayOf(t), -14), cells = [];
    for (var i = 0; i < 21; i++) {
      var ds = addDays(start, i);

    }
    var counts = {}, total = 0;
    CORE.forEach(function (x) { counts[x.id] = 0; });
    for (var j = 0; j < 7; j++) {
      var d = getDay(addDays(t, -j));
      if (d && Array.isArray(d.c)) d.c.forEach(function (id) { if (id in counts) { counts[id]++; total++; } });
    }
    var best = CORE.slice().sort(function (a, b) { return counts[b.id] - counts[a.id]; })[0];
    var items = 0;
    Object.keys(state.days).forEach(function (k) { items += cCount(state.days[k]); });
    var wl = weightList();
    var wd = wl.length > 1 ? Math.round((wl[wl.length - 1].w - wl[0].w) * 10) / 10 : null;
    return {
      streak: streak(), rate: rate7(), days: recordedDays(), items: items, cells: cells,
      best: best, bestN: counts[best.id], hasBest: total > 0,
      wdelta: wd, hasWeight: wd !== null
    };
  }
  function defaultShareText() {
    var s = streak();
    if (s >= 7) return '没节食，没去健身房，只是每天做到一点点。';
    if (s >= 1) return '都是些不用咬牙就能做的小事。';
    if (recordedDays() > 0) return '断了也没关系，今天勾一项就接上。';
    return '从今天开始，把减肥放进原本的生活里。';
  }
  function weightLabel(S) {
    if (!S.hasWeight) return '';
    var d = S.wdelta;
    if (d > 0) return '体重累计 ↑' + d.toFixed(1) + ' kg';
    if (d < 0) return '体重累计 ↓' + Math.abs(d).toFixed(1) + ' kg';
    return '体重持平';
  }
  function weightColor(S) { return S.hasWeight && S.wdelta > 0 ? '#D25B4B' : SH.deep; }

  function drawXHS(ctx, S, D) {
    var W = 1080, H = 1440, P = 80;
    ctx.fillStyle = SH.bg; ctx.fillRect(0, 0, W, H);
    ctx.beginPath(); ctx.arc(W + 40, 130, 300, 0, Math.PI * 2); ctx.fillStyle = '#F1F7F1'; ctx.fill();

    ctx.beginPath(); ctx.arc(P + 14, 92, 14, 0, Math.PI * 2); ctx.fillStyle = SH.green; ctx.fill();
    cText(ctx, '慢慢瘦', P + 42, 104, 34, SH.deep, true);
    cText(ctx, '日常减脂 · 第 ' + Math.max(1, diffDays(todayStr(), state.created) + 1) + ' 天',
      W - P, 104, 24, SH.sub, false, 'right');
    ctx.strokeStyle = SH.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(P, 145); ctx.lineTo(W - P, 145); ctx.stroke();

    cText(ctx, S.streak > 0 ? '连续 ' + S.streak + ' 天' : '今天开个头', P, 260, 88, SH.deep, true);
    var lines = wrapLines(ctx, D.text || defaultShareText(), W - 2 * P, 2, 30, false);
    lines.forEach(function (l, i) { cText(ctx, l, P, 325 + i * 44, 30, SH.ink, false); });

    var cw = (W - 2 * P - 40) / 3, cy = 400, ch = 152;
    var cards = [
      { v: S.days + ' 天', l: '已记录天数' },
      { v: S.rate + '%', l: '本周完成率' },
      { v: S.items + ' 项', l: '累计做到' }
    ];
    cards.forEach(function (c, i) {
      var x = P + i * (cw + 20);
      rRect(ctx, x, cy, cw, ch, 22, SH.card, SH.line, 2);
      cText(ctx, c.v, x + 24, cy + 80, 54, SH.deep, true);
      cText(ctx, c.l, x + 24, cy + 124, 24, SH.sub, false);
    });

    cText(ctx, '最近三周', P, 620, 30, SH.ink, true);
    var sub = D.showWeight && S.hasWeight ? weightLabel(S) : '越深，做得越多';
    cText(ctx, sub, W - P, 620, 22, D.showWeight && S.hasWeight ? weightColor(S) : SH.sub, false, 'right');

    var cell = 118, gap = 16, hx = P, hy = 690;
    var wd7 = ['一', '二', '三', '四', '五', '六', '日'];
    wd7.forEach(function (w, i) { cText(ctx, w, hx + i * (cell + gap) + cell / 2, hy - 18, 20, SH.sub, false, 'center'); });
    drawHeat(ctx, hx, hy, cell, gap, S.cells, true);

    var by = 1110;
    rRect(ctx, P, by, W - 2 * P, 112, 20, SH.soft);
    if (S.hasBest) {
      cText(ctx, '最稳的一项', P + 28, by + 46, 24, SH.deep, true);
      cText(ctx, S.best.title + ' · 近 7 天做到 ' + S.bestN + ' 次', P + 28, by + 88, 28, SH.deep, false);
    } else {
      cText(ctx, '从今天开始，勾一项就算开场。', P + 28, by + 68, 28, SH.deep, false);
    }

    ctx.font = '24px ' + FONT;
    var tx = P, ty = 1268;
    SHARE.tags.forEach(function (tag) {
      var tw = ctx.measureText(tag).width + 40;
      rRect(ctx, tx, ty, tw, 56, 28, SH.card, SH.line, 2);
      cText(ctx, tag, tx + 20, ty + 37, 24, SH.ink, false);
      tx += tw + 14;
    });

    cText(ctx, SHARE.slogan, P, 1380, 32, SH.deep, true);
    cText(ctx, SHARE.footer, W - P, 1380, 22, SH.sub, false, 'right');
  }

  function drawWechat(ctx, S, D) {
    var W = 1200, H = 675, P = 64;
    ctx.fillStyle = SH.bg; ctx.fillRect(0, 0, W, H);
    ctx.beginPath(); ctx.arc(W + 80, 60, 260, 0, Math.PI * 2); ctx.fillStyle = '#F1F7F1'; ctx.fill();

    ctx.beginPath(); ctx.arc(P + 11, 72, 11, 0, Math.PI * 2); ctx.fillStyle = SH.green; ctx.fill();
    cText(ctx, '慢慢瘦', P + 32, 82, 26, SH.deep, true);
    cText(ctx, S.streak > 0 ? '连续 ' + S.streak + ' 天' : '今天开个头', P, 205, 68, SH.deep, true);
    var lines = wrapLines(ctx, D.text || defaultShareText(), 480, 2, 24, false);
    lines.forEach(function (l, i) { cText(ctx, l, P, 258 + i * 36, 24, SH.ink, false); });

    var nums = [
      { v: S.days + ' 天', l: '已记录' },
      { v: S.rate + '%', l: '本周完成率' },
      { v: S.items + ' 项', l: '累计做到' }
    ];
    var nx = P;
    nums.forEach(function (n, i) {
      cText(ctx, n.v, nx, 390, 40, SH.deep, true);
      cText(ctx, n.l, nx, 424, 20, SH.sub, false);
      if (i < 2) {
        ctx.strokeStyle = SH.line; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(nx + 152, 358); ctx.lineTo(nx + 152, 430); ctx.stroke();
      }
      nx += 170;
    });

    cText(ctx, SHARE.tags.join(' · '), P, 505, 20, SH.sub, false);
    cText(ctx, SHARE.slogan, P, 590, 30, SH.green, true);
    cText(ctx, SHARE.footer, P, 625, 19, SH.sub, false);

    var cx = 620, cyy = 64, cw = 516, ch = 547;
    rRect(ctx, cx, cyy, cw, ch, 24, SH.card, SH.line, 2);
    cText(ctx, '最近三周', cx + 34, cyy + 56, 26, SH.ink, true);
    var sub = D.showWeight && S.hasWeight ? weightLabel(S) : '越深，做得越多';
    cText(ctx, sub, cx + cw - 34, cyy + 56, 19,
      D.showWeight && S.hasWeight ? weightColor(S) : SH.sub, false, 'right');

    var cell = 56, gap = 8, hx = cx + 34, hy = cyy + 90;
    var wd7 = ['一', '二', '三', '四', '五', '六', '日'];
    wd7.forEach(function (w, i) { cText(ctx, w, hx + i * (cell + gap) + cell / 2, hy - 10, 15, SH.sub, false, 'center'); });
    drawHeat(ctx, hx, hy, cell, gap, S.cells, false);

    var ry = cyy + 320;
    rRect(ctx, cx + 34, ry, cw - 68, 92, 16, SH.soft);
    if (S.hasBest) {
      cText(ctx, '最稳的一项', cx + 54, ry + 36, 20, SH.deep, true);
      cText(ctx, S.best.title + ' · ' + S.bestN + '/7 天', cx + 54, ry + 70, 22, SH.deep, false);
    } else {
      cText(ctx, '从今天开始，勾一项就算开场。', cx + 54, ry + 56, 22, SH.deep, false);
    }

    var lx = cx + 34, ly = cyy + 455;
    cText(ctx, '少', lx, ly, 18, SH.sub, false);
    HEAT.forEach(function (col, i) { rRect(ctx, lx + 28 + i * 26, ly - 16, 20, 20, 5, col); });
    cText(ctx, '多', lx + 28 + 5 * 26 + 4, ly, 18, SH.sub, false);
    cText(ctx, SHARE.tags.join(' · '), cx + 34, cyy + 510, 18, SH.sub, false);
  }

  function openShare() {
    shareState.layout = 'xhs';
    shareState.text = defaultShareText();
    shareState.showWeight = false;
    document.body.style.overflow = 'hidden';
    renderShareModal();
  }
  function closeShare() {
    el('modalRoot').innerHTML = '';
    document.body.style.overflow = '';
    shareCanvas = null;
    shareTimer = null;
  }
  function renderShareModal() {
    var seg = '';
    Object.keys(SHARE.sizes).forEach(function (k) {
      seg += '<button type="button" data-act="layout" data-layout="' + k + '" class="' +
        (shareState.layout === k ? 'on' : '') + '">' + SHARE.sizes[k].name + '</button>';
    });
    el('modalRoot').innerHTML =
      '<div class="modal" id="shareModal"><div class="modal-inner">' +
      '<div class="modal-head"><span class="modal-title">生成分享图</span>' +
      '<button class="modal-close" type="button" data-act="closeShare">关闭</button></div>' +
      '<div class="seg">' + seg + '</div>' +
      '<div class="share-label">配一句话（可改，最多 40 字）</div>' +
      '<input class="share-input" id="shareText" maxlength="40" value="' + esc(shareState.text) + '" placeholder="写一句这次想说的">' +
      '<div class="switch-row" data-act="toggleWeight"><span>显示体重变化 <span class="small">默认关闭，不公开体重</span></span>' +
      '<span class="switch' + (shareState.showWeight ? ' on' : '') + '"></span></div>' +
      '<div class="share-preview"><img id="shareImg" alt="分享图预览"></div>' +
      '<div class="share-hint">iPhone：长按上方图片 → 存储到照片。<br>安卓 / 电脑：点下面的「下载图片」。</div>' +
      '<div class="share-actions"><button class="btn-sec" type="button" data-act="closeShare">再改改</button>' +
      '<button class="btn-save" type="button" data-act="saveImg">下载图片</button></div>' +
      '</div></div>';
    redrawShare();
  }
  function redrawShare() {
    if (!shareCanvas) shareCanvas = document.createElement('canvas');
    var size = SHARE.sizes[shareState.layout] || SHARE.sizes.xhs;
    shareCanvas.width = size.w; shareCanvas.height = size.h;
    var ctx = shareCanvas.getContext('2d');
    if (!ctx) { toast('这个浏览器不支持图片生成'); return; }
    var S = shareStats();
    if (shareState.layout === 'wechat') drawWechat(ctx, S, shareState);
    else drawXHS(ctx, S, shareState);
    var img = el('shareImg');
    if (img) img.src = shareCanvas.toDataURL('image/png');
  }
  function saveShareImg() {
    if (!shareCanvas) return;
    try {
      shareCanvas.toBlob(function (blob) {
        if (!blob) { toast('生成失败，请重试'); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '慢慢瘦-' + shareState.layout + '-' + todayStr() + '.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        toast('图片已生成');
      }, 'image/png');
    } catch (e) { toast('这个浏览器不支持下载，请长按图片保存'); }
  }

  /* ---------------- 渲染 / 路由 ---------------- */
  function renderAll() {
    TABS.forEach(function (tab) {
      var btn = document.querySelector('.tab[data-tab="' + tab + '"]');
      if (btn) btn.classList.toggle('active', tab === curTab);
    });
    var t = todayStr();
    el('topbarRight').innerHTML = viewDate === t
      ? '<span>第 ' + Math.max(1, diffDays(t, state.created) + 1) + ' 天</span>'
      : '<button class="link-btn" type="button" data-act="backToday">回到今天</button>';
    var main = el('main');
    main.innerHTML = curTab === 'plan' ? renderPlan() : (curTab === 'log' ? renderLog() : renderToday());
    main.classList.remove('fade-in');
    void main.offsetWidth;
    main.classList.add('fade-in');
    window.scrollTo(0, 0);
  }
  function go(tab) {
    if (TABS.indexOf(tab) < 0) return;
    curTab = tab;
    try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; }
    renderAll();
  }

  function toggle(kind, id) {
    var valid = kind === 'c' ? CORE_IDS : BONUS_IDS;
    if (valid.indexOf(id) < 0) return;
    var d = ensureDay(viewDate);
    var arr = kind === 'c' ? d.c : d.b;
    var i = arr.indexOf(id);
    if (i >= 0) arr.splice(i, 1); else arr.push(id);
    if (!d.c.length && !d.b.length && d.w == null) delete state.days[viewDate];
    save();
    renderAll();
  }
  function saveWeight() {
    var input = el('wInput');
    if (!input) return;
    var v = parseFloat(input.value);
    if (!isFinite(v) || v < 20 || v > 300) { toast('填一个 20～300 之间的数字'); return; }
    v = Math.round(v * 10) / 10;
    var d = ensureDay(viewDate);
    d.w = v;
    save(); renderAll(); toast('记下了：' + v + ' kg');
  }
  function exportData() {
    try {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = '慢慢瘦-' + todayStr() + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('备份已导出');
    } catch (e) { toast('导出失败，请换个浏览器试试'); }
  }
  function union(a, b, valid) {
    var out = [];
    (a || []).concat(b || []).forEach(function (x) { if (valid.indexOf(x) >= 0 && out.indexOf(x) < 0) out.push(x); });
    return out;
  }
  function importData(text) {
    try {
      var o = JSON.parse(text);
      if (!o || typeof o.days !== 'object' || !o.days) throw new Error('bad');
      var n = 0;
      Object.keys(o.days).forEach(function (k) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
        var src = o.days[k] || {};
        var dst = state.days[k] || { c: [], b: [], w: null };
        dst.c = union(dst.c, src.c, CORE_IDS);
        dst.b = union(dst.b, src.b, BONUS_IDS);
        if (dst.w == null && typeof src.w === 'number' && src.w >= 20 && src.w <= 300) dst.w = src.w;
        state.days[k] = dst; n++;
      });
      if (o.created && o.created < state.created) state.created = o.created;
      save(); renderAll(); toast('已合并 ' + n + ' 天的记录');
    } catch (e) { toast('文件读不出来，请选择本工具导出的 JSON'); }
  }

  document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'shareModal') { closeShare(); return; }
    var tab = e.target.closest && e.target.closest('.tab[data-tab]');
    if (tab) { go(tab.getAttribute('data-tab')); return; }
    var node = e.target.closest && e.target.closest('[data-act]');
    if (!node) return;
    var act = node.getAttribute('data-act');
    if (act === 'toggle') toggle(node.getAttribute('data-kind'), node.getAttribute('data-id'));
    else if (act === 'oneThing') toggle('c', 'walk');
    else if (act === 'prevDay') { if (diffDays(todayStr(), viewDate) < 30) { viewDate = addDays(viewDate, -1); renderAll(); } }
    else if (act === 'nextDay') { if (viewDate < todayStr()) { viewDate = addDays(viewDate, 1); renderAll(); } }
    else if (act === 'backToday') { viewDate = todayStr(); renderAll(); }
    else if (act === 'savew') saveWeight();
    else if (act === 'delw') {
      var d = getDay(viewDate);
      if (d) { d.w = null; if (!d.c.length && !d.b.length) delete state.days[viewDate]; save(); renderAll(); }
    }
    else if (act === 'export') exportData();
    else if (act === 'import') el('importFile').click();
    else if (act === 'clear') {
      if (window.confirm('确定清空全部记录吗？此操作不能撤销。\n建议先在上面导出一份备份。')) {
        try { localStorage.removeItem(KEY); } catch (e) {}
        state = blank(); viewDate = todayStr(); renderAll(); toast('已清空，可以重新开始');
      }
    }
    else if (act === 'share') openShare();
    else if (act === 'closeShare') closeShare();
    else if (act === 'layout') {
      var L = node.getAttribute('data-layout');
      if (SHARE.sizes[L]) { shareState.layout = L; renderShareModal(); }
    }
    else if (act === 'toggleWeight') { shareState.showWeight = !shareState.showWeight; renderShareModal(); }
    else if (act === 'saveImg') saveShareImg();
  });
  el('importFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { importData(String(r.result)); };
    r.onerror = function () { toast('文件读取失败'); };
    r.readAsText(f);
    e.target.value = '';
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'shareText') {
      shareState.text = e.target.value;
      clearTimeout(shareTimer);
      shareTimer = setTimeout(redrawShare, 120);
    }
  });
  window.addEventListener('hashchange', function () {
    var h = location.hash.replace('#', '');
    if (TABS.indexOf(h) >= 0 && h !== curTab) { curTab = h; renderAll(); }
  });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && el('wInput') && document.activeElement === el('wInput')) saveWeight();
  });

  el('tabIcToday').innerHTML = svg('today');
  el('tabIcPlan').innerHTML = svg('plan');
  el('tabIcLog').innerHTML = svg('log');
  renderAll();
})();

</script>
</body>
</html>
